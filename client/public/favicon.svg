<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)"/>
  <rect x="48" y="48" width="416" height="416" rx="96" fill="#080c14"/>

  <!-- Code Icon Symbol -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M192 160L96 256L192 352" stroke="#818cf8" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right Bracket > -->
    <path d="M320 160L416 256L320 352" stroke="#2dd4bf" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Slash / -->
    <path d="M280 128L232 384" stroke="#c084fc" stroke-width="36" stroke-linecap="round" fill="none"/>
  </g>
</svg>
